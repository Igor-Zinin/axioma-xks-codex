name: chess-benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chess-v01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Evaluator contract
        run: npm run test:benchmark

      - name: Reference baseline
        run: npm run benchmark:chess

      - name: Validate saved result
        run: node -e "const r=require('./docs/data/chess-reference-result-v0.1.json'); if(r.metrics.pass_rate!==1 || r.metrics.consistency!==1 || r.trials!==3) process.exit(1); console.log('GREEN saved baseline: 15/15, 3 trials, consistency 1.0')"
