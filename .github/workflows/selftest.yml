name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every claim has a check
        # Флаг SKIP_NETWORK нарочно не передаём: сетевые проверки (C-06)
        # должны попытаться выполниться по-настоящему. Если FIDE блокирует IP
        # раннера GitHub Actions, fetch сам упадёт по таймауту/сети, и
        # selftest.mjs пометит проверку как SKIPPED (код возврата 2) — это
        # честное "не проверено", а не молчаливый зелёный, каким был флаг.
        #
        # Три исхода:
        #  0 — всё выполнено и прошло: шаг зелёный.
        #  1 — реальный провал (RED), например evidence.ref теперь ведёт не
        #      туда: шаг обязан упасть.
        #  2 — провалов нет, но C-06 не смог проверить сеть (SKIPPED): это
        #      известное ограничение среды (раннеры GH заблокированы FIDE),
        #      а не дефект кода — шаг не роняем, но печатаем предупреждение,
        #      которое видно в логе и в Summary. Полная проверка C-06 —
        #      обязанность локального прогона (см. README).
        run: |
          set +e
          node selftest.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "selftest: GREEN (exit 0)"
            exit 0
          elif [ "$code" -eq 1 ]; then
            echo "::error::selftest FAILED — see RED lines above"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::selftest INCOMPLETE — network check(s) SKIPPED in CI (expected: FIDE blocks GitHub Actions runner IPs). Run 'node selftest.mjs' locally without SKIP_NETWORK for a full C-06 verification."
            exit 0
          else
            echo "::error::selftest exited with unexpected code $code"
            exit 1
          fi

      - name: Chess evaluator contract
        run: npm run test:benchmark

      - name: Chess v0.1 reference baseline
        run: npm run benchmark:chess

      - name: Validate saved chess result
        run: |
          node <<'NODE'
          const r = require('./docs/data/chess-reference-result-v0.1.json');
          if (r.metrics.pass_rate !== 1 || r.metrics.consistency !== 1 || r.trials !== 3) process.exit(1);
          console.log('GREEN saved baseline: 15/15, 3 trials, consistency 1.0');
          NODE
